name: 探測桌球／攀登／田徑

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "桌球：data / video / cover / plain；攀登與田徑：more climb / more athlete"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install brotli
      - env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IN_PARTS: ${{ inputs.parts }}
        run: |
          set -- $IN_PARTS
          if [ "$1" = "more" ]; then shift; python scripts/probe_more.py "$@"; else python scripts/probe_tt.py "$@"; fi
