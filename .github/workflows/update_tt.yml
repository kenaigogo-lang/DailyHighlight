name: 更新桌球精華

on:
  schedule:
    # 比賽多在歐洲／中東／亞洲，時間分散，所以全天每 20 分鐘檢查一次。
    # 賽事進行中官方只提供「最新 10 場」，要頻繁輪詢才不會漏；沒有賽事時幾秒就結束。
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install brotli
      - name: 抓資料
        id: fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TT_FORCE_VIDEO: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set +e
          python scripts/fetch_tt.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/tt
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "tt data: 更新 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
      - name: 失敗時標成失敗
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "::error::抓桌球資料時發生錯誤，請看上方「抓資料」步驟的紀錄"
          exit 1
