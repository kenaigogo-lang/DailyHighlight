name: 更新每日精華

on:
  schedule:
    # GitHub 的排程常常延遲好幾小時、甚至整次跳過，所以多排幾個時段當保險。
    # 已經完整的日期會直接略過，多跑幾次幾乎不花資源。
    # 台灣時間 13:17～23:17 每小時一次（UTC 05:17～15:17）
    - cron: "17 5-15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "只抓指定日期（美國日期 YYYY-MM-DD，留空＝自動）"
        required: false
      force:
        description: "已完整的日期也重抓"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓資料
        id: fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IN_DATE: ${{ inputs.date }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$IN_DATE" ]; then args+=(--date "$IN_DATE"); fi
          if [ "$IN_FORCE" = "true" ]; then args+=(--force); fi
          set +e
          python scripts/fetch.py "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "data: 更新 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: YouTube 查詢失敗時標成失敗
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "::error::抓資料時發生錯誤（多半是 YouTube API 金鑰或額度問題），請看上方「抓資料」步驟的紀錄"
          exit 1
