name: 更新每日精華

on:
  schedule:
    # NBA ＋ 桌球一起更新。桌球賽事進行中官方只提供「最新 10 場」，要頻繁輪詢，
    # 所以全天每 20 分鐘一次；已完整的日期／賽事會直接略過，沒事做時幾秒就結束。
    # GitHub 排程常延遲或跳過，建議另外用 cron-job.org 每 20 分鐘觸發這個流程。
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "只抓指定日期（美國日期 YYYY-MM-DD，留空＝自動）"
        required: false
      force:
        description: "已完整的日期也重抓"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install brotli

      - name: 抓 NBA 資料
        id: fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IN_DATE: ${{ inputs.date }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$IN_DATE" ]; then args+=(--date "$IN_DATE"); fi
          if [ "$IN_FORCE" = "true" ]; then args+=(--force); fi
          set +e
          python scripts/fetch.py "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 抓桌球資料
        id: fetch_tt
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TT_FORCE_VIDEO: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set +e
          python scripts/fetch_tt.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "data: 更新 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: 有錯誤時標成失敗
        if: steps.fetch.outputs.code != '0' || steps.fetch_tt.outputs.code != '0'
        run: |
          echo "::error::抓資料時發生錯誤（NBA=${{ steps.fetch.outputs.code }}、桌球=${{ steps.fetch_tt.outputs.code }}），請看上方步驟的紀錄"
          exit 1
